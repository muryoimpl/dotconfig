onboarding = false
# herdr config
# 既存の tmux/tmux.conf をベースに、同じような使用感で使えるよう設計。
# 参照: https://herdr.dev/docs/configuration/

# ==========================================================================
# core
# ==========================================================================
[update]
channel = "stable"

[terminal]
default_shell = "zsh"
shell_mode    = "login"
# tmux の split 時 cwd 継承と揃える。
# "current" は herdr プロセスの cwd を指すため継承にはならない ("follow" が継承)。
new_cwd       = "follow"

[worktrees]
directory = "~/ghq/worktrees"

[remote]
manage_ssh_config = false

[session]
resume_agents_on_restore = true

# ==========================================================================
# keybindings — tmux.conf の bind を herdr にマップ
# ==========================================================================
[keys]
# tmux: set -g prefix C-a
prefix = "ctrl+a"

# --- 設定リロード -----------------------------------------------------------
# tmux: bind r source-file ~/.config/tmux/tmux.conf
# reload_config を prefix+r に取り、resize_mode は退避
reload_config = "prefix+r"
resize_mode   = "prefix+ctrl+r"

# --- tab (= tmux window) ---------------------------------------------------
# tmux: bind Space choose-window
# 対応するのは herdr の navigate mode (= goto)。switch_tab は "1..9" 専用の
# indexed binding で、それ以外を書くと binding ごと無効化される。
goto         = "prefix+space"
# tmux base-index=1 相当。prefix+1..9 でタブ直接切替
switch_tab   = "prefix+1..9"
# tmux: bind -r C-h/C-l select-window -t :-/+
previous_tab = "prefix+p"
next_tab     = "prefix+n"
# tmux デフォルト系
new_tab      = "prefix+c"
# 記号キーは herdr 推奨の名前付き表記 (minus/comma/ampersand/plus/backtick)
close_tab    = "prefix+ampersand"
# tmux: bind T command-prompt -I "#W" "rename-window '%%'"
# (bind T の tig popup は 17c9195 で rename-window に置き換え済み)
rename_tab   = "prefix+shift+t"
detach       = "prefix+d"

# --- pane 分割 -------------------------------------------------------------
# tmux: bind | split-window -h (左右並び=分割線が縦)
# "|" は生の記号のみ受理される ("pipe"/"bar" は invalid keybinding)
split_vertical   = "prefix+|"
# tmux: bind - split-window -v (上下並び=分割線が横)
split_horizontal = "prefix+minus"

# --- pane 移動 -------------------------------------------------------------
# tmux: bind h/j/k/l select-pane
focus_pane_left  = "prefix+h"
focus_pane_down  = "prefix+j"
focus_pane_up    = "prefix+k"
focus_pane_right = "prefix+l"

# --- pane rotation ---------------------------------------------------------
# tmux: bind -n C-o select-pane -t :.+ (prefix なし)
# 単独 ctrl+o が受理されない場合は "prefix+o" にフォールバック
cycle_pane_next     = "ctrl+o"
cycle_pane_previous = "prefix+shift+o"

# --- その他 pane 操作 -------------------------------------------------------
zoom       = "prefix+z"
close_pane = "prefix+x"

# --- copy mode -------------------------------------------------------------
# tmux: bind v copy-mode
# 開始キーのみカスタム可、mode 内の v/V/y/Enter/w/e/b/g/G/// は herdr 内蔵に一任
copy_mode = "prefix+v"

# --- agent / workspace ナビゲーション (tmux には対応物なし) -----------------
# herdr 固有。agent panel の並び順 (= agent_panel_sort) で agent 間を移動する。
# priority と組み合わせると「次に見るべき agent」へ順に飛べる。
# prefix+n/p は tab、prefix+shift+* は resize custom command で埋まっているため
# prefix+ctrl+* を使う。
next_agent     = "prefix+ctrl+n"
previous_agent = "prefix+ctrl+p"
# agent を 1..9 で直接フォーカス (switch_tab と同じ indexed 構文)
focus_agent    = "prefix+alt+1..9"
# workspace を 1..9 で直接切替。workspace を作業単位に分けると tab より使う
switch_workspace = "prefix+shift+1..9"
# tmux: bind ';' last-pane 相当。herdr では workspace/tab をまたいで戻れる
last_pane      = "prefix+semicolon"

# --- default ---
# toggle_sidebar = "prefix+b"
# prefix+o    = open_notification_target (通知の対象 pane へジャンプ)
# prefix+e    = edit_scrollback ($EDITOR で pane の scrollback を開く)
# prefix+w    = workspace picker
# prefix+g    = 空き (goto を prefix+space に移したため)

# ==========================================================================
# custom commands — tmux で `[[keys.command]]` に置き換えるもの
# ==========================================================================

# tmux 側の tig popup (bind T) は rename-window に置き換え済みのため未定義。
# prefix+shift+t は rename_tab に返している。
# 復活させる場合、herdr の popup は tab レイアウトを変えない session-modal
# terminal で tmux の display-popup とほぼ同じ挙動になる:
#   [[keys.command]]
#   key         = "prefix+alt+t"
#   type        = "popup"
#   command     = "tig"
#   width       = "80%"
#   height      = "80%"
#   description = "Open tig in a popup (tmux display-popup 相当)"

# tmux: bind -r H/J/K/L resize-pane 5
# resize_mode に頼らず tmux 風の prefix+SHIFT+hjkl を維持
[[keys.command]]
key         = "prefix+shift+h"
type        = "shell"
command     = "herdr pane resize --direction left --amount 0.05 --current"
description = "Resize pane left by 5% (tmux 風)"

[[keys.command]]
key         = "prefix+shift+j"
type        = "shell"
command     = "herdr pane resize --direction down --amount 0.05 --current"
description = "Resize pane down by 5% (tmux 風)"

[[keys.command]]
key         = "prefix+shift+k"
type        = "shell"
command     = "herdr pane resize --direction up --amount 0.05 --current"
description = "Resize pane up by 5% (tmux 風)"

[[keys.command]]
key         = "prefix+shift+l"
type        = "shell"
command     = "herdr pane resize --direction right --amount 0.05 --current"
description = "Resize pane right by 5% (tmux 風)"

# ==========================================================================
# theme — 背景は tmux の bg=black に寄せ、accent は catppuccin 既定 (#cba6f7)
# ==========================================================================
[theme]
name        = "catppuccin"
auto_switch = false

[theme.custom]
panel_bg = "#000000"   # tmux の完全な黒に寄せる
green    = "#00cd00"   # alacritty 側の green と統一

# sidebar の背景は theme 側の既定が Color::Reset = 端末の背景そのまま。
# ただし 0.9.0 の --default-config が sidebar_bg = "#181825" を例示しており、既定が
# 変わるとハイライトのコントラストが軒並み落ちる (下の surface_dim なら 2.22→1.86)。
# alacritty の background と揃えた純黒に固定したいので明示しておく。
sidebar_bg = "reset"

# sidebar のハイライト背景を明るくする。
# 上記のとおり背景は #000000。catppuccin 既定の surface_dim (#1e1e2e) は純黒に対する
# コントラスト比が 1.28 しかなく、一度 #2f2f45 (1.61) まで上げたが、それでも agents
# パネルの「いまアクティブな行」と通常行の差が読み取りにくかった。色相 (240) と彩度
# (約 0.19) はそのままに、3 段とももう 1 段引き上げる。3 段は
# 「アクティブ < navigate 選択 < ドラッグ」という序列なので、1 つだけ上げると段差が潰れる。
#   surface_dim / active_row_bg … agents パネルのアクティブ行 / workspace のアクティブ行
#                 の背景。区切り線・scrollbar のトラック・非アクティブ pane border の fg
#                 にも同じ色が使われる (ui/sidebar.rs, ui/panes.rs)
#   surface0 / selection_bg … spaces パネルで navigate 中に選択している行の背景
#   surface1  … workspace をドラッグ中の行の背景 (0.9.0 でも新名称はない)
# 対 #000000 のコントラスト比: dim 1.61→2.22 / surface0 2.30→3.03 / surface1 3.15→3.88
#
# 0.9.0 で active_row_bg / selection_bg という名前が増えたが、旧名も CustomThemeColors に
# 残っていて、どちらが優先されるかはバイナリからは判別できなかった。どちらが勝っても
# 同じ色になるよう、新旧を同じ値で書いてある。
surface_dim   = "#434363"
active_row_bg = "#434363"
surface0      = "#575780"
selection_bg  = "#575780"
surface1      = "#676794"

# sidebar の二次情報 (agent 名 / tab 名 / terminal_title / $prompt / トークン区切り) の色。
# catppuccin 既定の overlay0 (#6c7086) はアクティブ行の背景 #434363 に対するコントラスト比が
# 1.94 しかなく、さらに ui/sidebar.rs:1510 がこれらに DIM を付けるため端末側で暗く合成されて
# 背景に沈む。背景を明るくした分、ここも overlay2 相当まで 2 段上げる。
# 対 #434363 は 1.94→3.35、対 #000000 は 4.30→7.44。一次情報の workspace 名
# (subtext0 #a6adc8 = 対黒 9.33 + BOLD) より暗いままなので、情報の序列は崩れない。
overlay0 = "#9399b2"

# ==========================================================================
# ui
# ==========================================================================
[ui]
# tmux: set -g mouse on
mouse_capture                     = true
# tmux: set -g focus-event on
redraw_on_focus_gained            = true
pane_borders                      = true
# tmux は border のみでペイン間にギャップを作らない
pane_gaps                         = false
# tmux 側の claude-window-flag.sh 相当を、herdr 内蔵 agent 検出で置き換える
show_agent_labels_on_pane_borders = true
# 有効値は spaces / workspaces / priority。
# 「claude を見落とさない」意図そのままに、blocked > done > working の
# attention queue 順で agent panel を並べる。並行 agent 時は spaces より直接的
agent_panel_sort = "priority"
sidebar_width                     = 32
confirm_close                     = true
# tmux: bind c は名前を尋ねず即座に window を作る
# false の間タブのラベルは生成名 (= 番号) のみ。名前を付けたい場合は
# rename_tab (prefix+shift+t) か `herdr tab rename <TAB_ID> <LABEL>` を使う。
# tmux の automatic-rename 相当 (プロセス名の自動反映) は herdr にない
# (タブラベルは custom_name か位置番号の 2 択で、cwd もプロセス名も OSC も見ない)。
# 代替として ~/.zsh.d/herdr-title.zsh が preexec から
# `herdr tab rename` / `herdr pane rename` を叩き、"<コマンド名>" を自動で入れている。
# ディレクトリ名は入れない。workspace をディレクトリ単位で分ける運用にしたことで
# spaces パネル側に出るようになり、タブ名に入れると重複表示になるため。
# なお `herdr tab rename` に --clear がないので、一度付いたタブ名は次に
# そのタブでコマンドを打つまで残る (プロンプトに戻っても番号には戻らない)。
prompt_new_tab_name               = false
# workspace の名前について (0.8.0 時点):
#   - 起動時に workspace 名を指定するオプションは存在しない
#   - 名前付きで起動できるのは session (`herdr --session <名前>` = tmux new -s 相当)
#   - workspace に名前を付けるのは起動後。
#     `herdr workspace create --label <名前> --cwd <dir> --focus` か、
#     prompt_new_workspace_name = true で作成時 (prefix+shift+n) に入力を求める
# tmux: set -g status-position top
tab_bar_position                  = "top"
# 外側 (ghostty) のウィンドウタイトル。既定は "{hostname}: {workspace}"。
# タブラベルに Linear の issue ID を入れる運用にしたので {tab} まで出すと、
# ウィンドウを切り替えて戻ってきたときにも「どのタスクか」が分かる。
# タブ名は ~/.claude/scripts/herdr-task.sh と ~/.zsh.d/herdr-title.zsh が付けている。
window_title                      = "{workspace} · {tab}"
# accent は未設定。theme (catppuccin) 既定の #89b4fa (blue) が
# アクティブ tab / pane border / navigator のハイライトに使われる。
# 2e723cc のコミットメッセージとここのコメントは長らく #cba6f7 と書いていたが、
# それは同じ palette の mauve (branch 名の色) で accent ではなかった。
# 実体は app/state.rs Palette::catppuccin() の accent: Rgb(137, 180, 250)。

# sidebar の Agent 行。既定は [["state_icon","workspace","tab"],["agent"]] だが、
# 並行 agent 時は「どの agent が今どの状態か」を先に読みたいので順序を入れ替える
#
# state_text は 0.9.0 のスタイル付きトークンにして、値が "working" のときだけ強調する。
# herdr には「実行中の行だけ背景色を変える」機能がない (背景が付くのはアクティブ行だけで、
# 状態は前景色にしか出ない: ui/status.rs state_label_color)。しかも ui/sidebar.rs は
# 非アクティブ行の状態ラベルに DIM を付けるため、裏で走っている claude ほど読みにくかった。
# そこで bold を足し dim を打ち消す。fg は書かない — 省略したフィールドは文脈既定を保つので
# 状態色 (yellow) はそのまま残る。rules は text 値のトークンにしか付けられない
# (state_icon と git_status は不可)。1 トークンあたり最大 16 ルール。
#
# agent / tab / terminal_title_stripped / $prompt は ui/sidebar.rs:1510 が overlay0 + DIM で
# 描いている。DIM は端末側で色を背景寄りに合成するため、行背景を明るくした状態では
# overlay0 を上げただけでは読めるようにならない。dim = false で DIM 自体を外す
# (apply_token_style は false のとき remove_modifier する)。色は overlay0 に任せるので
# fg は書かない。workspace は name_style (text/subtext0 + BOLD) で DIM が付かないため素のまま。
[ui.sidebar.agents]
rows = [
  ["state_icon", { token = "agent", dim = false }, { token = "state_text", rules = [{ equals = "working", bold = true, dim = false }] }],
  ["workspace", { token = "tab", dim = false }],
]

# claude だけ OSC タイトルと最新プロンプトを 1 行ずつ足す。
# キーは canonical id で、検出エイリアスの "claude-code" は不可。
# rows_by_agent は rows を「置き換える」ので、共通行も書き下す必要がある
#
# 2 行は役割が違うので両方出す:
#   terminal_title_stripped … Claude Code がセッション開始時に決めたきり毎プロンプト
#     では更新しないため、会話が進んでも初回プロンプト由来の要約が出続ける。
#     裏を返せばセッション単位で不変なので「この pane が何の作業か」の目印になる。
#     なお spinner glyph を必ず落とすわけではなく "◑ ..." のまま残ることがある。
#   $prompt … 「いま何を指示したか」。built-in token ではなく pane metadata の
#     カスタム token で、~/.claude/scripts/herdr-prompt-token.sh
#     (dotfiles/_claude/scripts/、UserPromptSubmit フック) が毎プロンプト
#     `herdr pane report-metadata --token prompt=...` で更新している。
#     config だけ見ても出処を辿れないのでここに書いておく。
#     token が無い間 (初回プロンプト前 / フック未登録 / claude 終了後) は
#     行ごと消える。空行にはならない (ui/sidebar/tokens.rs の resolved.is_empty)。
#
# $prompt の先頭に "«" が付いているものは herdr agent prompt 等で agent 側から
# 投げられたプロンプト。UserPromptSubmit は投げ元に関係なく発火するため、
# フック側が「自 pane が focus されているか」で人間が打ったものかを判定している。
# focus 中の pane に他 agent が投げた場合は marker が付かない、ヒューリスティック。
#
# 幅: sidebar_width = 32 から区切り 1 桁と 2 行目以降のインデント 3 桁を引いて
# 実効 28 桁。フック側 HERDR_PROMPT_MAX_WIDTH の既定値と一致させてある。
[ui.sidebar.agents.rows_by_agent]
claude = [
  ["state_icon", { token = "agent", dim = false }, { token = "state_text", rules = [{ equals = "working", bold = true, dim = false }] }],
  [{ token = "terminal_title_stripped", dim = false }],
  [{ token = "$prompt", dim = false }],
  ["workspace", { token = "tab", dim = false }],
]

# [ui.sidebar.spaces] は既定 [["state_icon","workspace"],["branch","git_status"]]。
# workspace をリポジトリ単位に分けると branch と ahead/behind が出る

[ui.toast]
delivery      = "herdr"
delay_seconds = 3

[ui.toast.herdr]
position = "top-right"

# tmux-yank 相当のコピー通知
[ui.toast.clipboard]
enabled  = true
position = "top-right"

[ui.sound]
enabled = true

# tmux の claude ハイライトの意図 (「見落とさない」) を音でも担保
[ui.sound.agents]
claude = "on"
droid  = "off"

# ==========================================================================
# advanced / experimental
# ==========================================================================
[advanced]
scrollback_limit_bytes = 10_485_760   # 10 MiB

[experimental]
allow_nested                        = false
# tmux: set -g allow-passthrough on の代替 (画像プロトコル通し)。
# kitty graphics 対応端末でのみ効く (ghostty/kitty は対応、alacritty は非対応)
kitty_graphics                      = true
# 日本語 IME 対応。TUI が自前でカーソルを描く際に候補ウィンドウが追従するよう、
# focus 中の pane のカーソルを外側端末に露出させる。
# cjk_ime_agents は単体では効かず、reveal_hidden_cursor_for_cjk_ime の
# allow-list として働く (空配列なら全 pane 対象)。
reveal_hidden_cursor_for_cjk_ime    = true
cjk_ime_cursor_shape                = "steady_block"
cjk_ime_agents                      = ["claude", "codex"]
# macOS 専用のため Linux では無効
switch_ascii_input_source_in_prefix = false
