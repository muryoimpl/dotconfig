# prefix
set-option -g prefix C-a
unbind C-b

set -g mouse on

set -g focus-event on

# neovim で Esc の認識が遅いのを改善する
set-option -g escape-time 0
set-option -sa terminal-overrides ',XXX:RGB'

# 閉じたときに再採番
set-option -g renumber-windows on

# 色設定 けど効いてない気がしたので、
# alias tmux='TERM=xterm-256color tmux' してる
set-option -g default-terminal tmux-256color
set -g terminal-overrides 'tmux:colors=256'

# Vi キーバインド
set-window-option -g mode-keys vi

# 設定リロード
bind-key r source-file ~/.config/tmux/tmux.conf

# escape sequence passthrough
set-option -g allow-passthrough on
###################################################
# status bar
###################################################
set-option -g status on
set-option -g status-interval 1

# ステータスバーをトップに配置する
set-option -g status-position top
set -g status-right '#{?client_prefix,#[reverse],} #h %Y-%m-%d(%a) %H:%M'
# claude code が動いている window をハイライトするため、status-left 末尾で
# scripts/claude-window-flag.sh を呼び、各 window に @has-claude を set する。
# スクリプト出力は空のため status bar の見た目は変わらない。
set -g status-left '#[fg=black,bg=blue][#S]#[default] #(~/.config/tmux/scripts/claude-window-flag.sh)'

# 文字色と背景色
set -g status-style fg=white,bg=black
set-option -g status-style bright
set -g window-status-current-style fg=brightwhite,bg=green
# claude code が動いている非アクティブ window だけ背景を深い紫 (colour54) に上書きする。
# アクティブ window では window-status-current-style (bg=green) を優先したいので
# current-format 側では背景を上書きしない。
# 非 claude 時は format から #[bg=...] を出さず、status-style の指定を
# そのまま継承させる (bg=black を明示すると status-style bright と組み合わさり
# bright black になり、グレーがかった色で描画されてしまうのを避けるため)。
set -g window-status-format         "#{?#{==:#{@has-claude},1},#[bg=colour54],}#I:#W#{?window_flags,#{window_flags}, }"
set -g window-status-current-format "#I:#W#{?window_flags,#{window_flags}, }"
set-option -g message-style fg=white,bg=black

###################################################
# コピー系
###################################################
# クリップボード連携
# コピーは copy-mode の y / マウス選択 (tmux-yank) に集約したため prefix C-c は廃止。
# 外部クリップボードからの貼り付けは端末ネイティブ (Ctrl+Shift+V / Cmd+V) に委ね、
# prefix C-v は tmux バッファ (直近のコピー) の貼り付けに割り当てる。
bind-key C-v paste-buffer

# http://qiita.com/b4b4r07/items/01359e8a3066d1c37edc
# Prefix+v でコピーモード開始
bind-key v copy-mode \; display "Copy mode!"

# Esc キーでコピーの反転を解除（コピーモードは抜けない）
bind-key -T copy-mode-vi Escape send-keys -X clear-selection
# Ctrl-c キーでコピーの反転を解除し、コピーモードから抜ける
bind-key -T copy-mode-vi C-c send-keys -X  cancel

# コピーモード中（Prefix+v 後）C-v で矩形選択開始
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
# 1行選択
bind-key -T copy-mode-vi V send-keys -X select-line

# Setup 'v' to begin selection as in Vim
bind-key -T copy-mode-vi v send-keys -X begin-selection
# クリップボードへのコピーは tmux-yank に委譲 (OS 別コマンドはプラグインが自動判定)。
# copy-mode-vi の y とマウス選択で OS を問わずクリップボードへコピーされる。
# Enter は tmux バッファのみ (クリップボードへは y / マウスを使用)。

# インタラクティブ zsh を明示。
# macOS の reattach-to-user-namespace は tmux-yank 併用で不要になったため OS 分岐を廃止。
set-option -g default-command "zsh"


# Vi モード中に Ctrl-e で行末に（Emacs ライク）
bind-key -T copy-mode-vi C-e send-keys -X end-of-line

# 単語の最初の1文字に移動
bind-key -T copy-mode-vi w send-keys -X next-word
# 単語の最後の1文字に移動
bind-key -T copy-mode-vi e send-keys -X next-word-end
# w の逆の動き back
bind-key -T copy-mode-vi b send-keys -X previous-word

# 画面上に映る最上行に移動
bind-key -T copy-mode-vi g send-keys -X top-line
# 画面上に映る最下行に移動
bind-key -T copy-mode-vi G send-keys -X bottom-line

# 前方検索
bind-key -T copy-mode-vi / command-prompt -ip "(search forward)" "send -X search-forward-incremental \"%%%\""
# 後方検索
bind-key -T copy-mode-vi ? command-prompt -ip "(search backward)" "send -X search-backward-incremental \"%%%\""

# ページスクロール
bind-key -T copy-mode-vi C-n send-keys -X page-up
bind-key -T copy-mode-vi C-f send-keys -X page-down

# ページ送り
bind-key -T copy-mode-vi C-u send-keys -X scroll-up
bind-key -T copy-mode-vi C-d send-keys -X scroll-down

###################################################
# ウインドウ・ペイン操作
###################################################
# ウィンドウ選択画面
bind Space choose-window

# Prefix+T で現在の window title を変更 (現在名を初期値として編集)
bind-key T command-prompt -I "#W" "rename-window '%%'"

# インデックスを1から
set-option -g base-index 1

# Prefix+- で横に、Prefix+| で縦に分割（ペイン）する
bind-key | split-window -h
bind-key - split-window -v

# Prefix + Ctrl-h/l でウィンドウ切り替え
# Prefix + Ctrl-h,h,h,h,...と連打できる
bind-key -r C-h select-window -t :-
bind-key -r C-l select-window -t :+

# Prefix+hjkl でペイン移動
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# ペインサイズを上下左右（Prefix+JKHL）に変更
# Prefix+J,J,J,J,...と連打してリサイズ可能
bind-key -r H resize-pane -L 5
bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r L resize-pane -R 5

# Ctrl-o でペインをローテーションしながら移動
# Prefix を用いないのでタイプが楽だが、Ctrl-o を使用してしまう
# 他のソフトウェアの設定に支障をきたさないように注意
bind-key -n C-o select-pane -t :.+

##################################
# plugins
##################################
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'

set -g @yank_selection 'clipboard'

run '~/.tmux/plugins/tpm/tpm'
