exec_once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
# cursor: GTK3/GTK4 は gsettings を XCURSOR_* env より優先するため必須 (実測確認済み)。
# dconf に永続するので本来は初回のみで足りるが、dotfiles から再現できるようここに置く。
exec_once=gsettings set org.gnome.desktop.interface cursor-theme 'Adwaita'
exec_once=gsettings set org.gnome.desktop.interface cursor-size 48

# wallpaper (noctalia があるときは noctalia が壁紙も管理するので awww は動かさない)
exec_once=command -v noctalia >/dev/null || bash ~/.config/mango/bin/awww.sh
# waybar
exec_once=bash ~/.config/mango/bin/waybar.sh
# shell (noctalia が入っていない環境では起動しない)
exec_once=command -v noctalia >/dev/null && noctalia --daemon
# message
exec_once=swaymsg layout default
# notification
exec_once=swaync
# power profile
exec_once=bash ~/.config/mango/bin/power-profile-notify.sh
# clipboard
exec_once=wl-clip-persist --clipboard regular --reconnect-tries 0
exec_once=wl-paste --type text --watch cliphist store
exec_once=/usr/lib/xdg-desktop-portal-wlr  >/dev/null 2>&1
# network manager
exec_once=nm-applet --indicator
# IME
exec_once=fcitx5 -d
# password manager
exec_once=1password --silent
# bluetooth
exec_once=blueman-applet
# screen layout
exec_once=bash ~/.config/screenlayout/default.sh
# permission authentication
exec_once=/usr/lib/xfce-polkit/xfce-polkit
# change sound volume and light value
exec_once=swayosd-server
# idle configuration
exec_once=swayidle -w
# VPN
exec_once=tailscale systray
