# More option see https://github.com/DreamMaoMao/mango/wiki/

# Window effect
blur=0
blur_layer=0
blur_optimized=1
blur_params_num_passes = 2
blur_params_radius = 5
blur_params_noise = 0.02
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.2

shadows = 0
layer_shadows = 0
shadow_only_floating = 1
shadows_size = 10
shadows_blur = 15
shadows_position_x = 0
shadows_position_y = 0
shadows_color= 0x000000ff

border_radius=6
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=1.0

# Animation Configuration(support type:zoom,slide)
# tag_animation_direction: 0-horizontal,1-vertical
animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.3
zoom_end_ratio=0.8
fade_in_begin_opacity=0.5
fade_out_begin_opacity=0.8
animation_duration_move=100
animation_duration_open=100
animation_duration_tag=150
animation_duration_close=800
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1

# Scroller Layout Setting
scroller_structs=20
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

# Master-Stack Layout Setting
new_is_master=1
default_master_factor=0.45
default_master_count=1
smart_gaps=0

# Overview Setting
hotarea_size=10
enable_hotarea=1
overview_gap_inner=5
overview_gap_outer=30

# Misc
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
idle_inhibit_ignore_visible=0
sloppy_focus=1
warp_cursor=1
focus_cross_monitor=0
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
# cursor (size は Adwaita が実サイズを持つ 24/30/36/48/72/96 から選ぶ)
# 変更時は env.conf の XCURSOR_SIZE と autostart.conf の gsettings も揃える
cursor_size=48
cursor_theme=Adwaita
# 見失い防止のため自動非表示は無効のまま (0 = 無効)
cursor_hide_timeout=0
cursor_hide_on_keypress=0
drag_tile_to_tile=1

# keyboard
repeat_rate=25
repeat_delay=600
numlock_on=1
xkb_rules_layout=us
xkb_rules_options=caps:ctrl_modifier

# Trackpad
disable_trackpad=0
tap_to_click=0
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=1
trackpad_disable_while_typing=1
trackpad_left_handed=0
trackpad_middle_button_emulation=0
swipe_min_threshold=1
trackpad_accel_speed=0.2
mouse_accel_speed=0.2

# mouse
mouse_natural_scrolling=0
# トラックパッド以外のポインタのスクロール量倍率 (0.1〜10.0)。
# 実行時の切り替え (scroll-profile.sh + waybar の custom/scroll) は廃止したので、
# 常にこの値が使われる。復活させたい場合は mango/bin/scroll-profile.sh を参照。
axis_scroll_factor=1.0

trackpad_scroll_method=1
trackpad_click_method=2
trackpad_send_events_mode=0
button_map=1

# Appearance
gap_inner_horizontal=5
gap_inner_vertical=5
gap_outer_horizontal=5
gap_outer_vertical=5
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
border_px=4
root_color=0x201b14ff
border_color=0x444444ff
focus_color=0x007bffff
maximized_screen_color=0x89aa61ff
urgent_color=0xad401fff
scratchpad_color=0x516c93ff
global_color=0xb153a7ff
overlay_color=0x14a57cff

source=~/.config/mango/env.conf
source=~/.config/mango/keymap.conf
source=~/.config/mango/rule.conf
source=~/.config/mango/autostart.conf

exec_once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
