[theme]
mode = "auto"

[bar]
order = [ "default" ]

# バーは出力ごとにインスタンス化され、既定では全モニタに出る。bar には
# "このモニタだけ" という許可リスト (monitors) が無いので、ベースを無効に
# しておき、モニタ単位の override で出したい画面だけ有効にする。
# 外部モニタは waybar 側に per-output のバー定義があるのでそちらに任せる。
[bar.default]
enabled = false

# ラップトップの内蔵ディスプレイ用。テーブルのキー ("eDP-1") がコネクタ名との
# マッチに使われる。同じテーブルに match フィールドも書けるが、キーが一致し
# ないと match だけでは効かず、キーが一致していれば match は無くてよい。
# font_weight と order 以外の bar の設定はここで上書きできる。
[bar.default.monitor."eDP-1"]
enabled = true
position = "left"

# バー本体の帯を消し、ウィジェットのカプセルだけを見せる。
# バーの長さは常に画面の辺いっぱいだが、見た目はウィジェット数に追従する。
background_opacity = 0.0
border_width = 0.0
shadow = false
capsule = true

# カプセルの角丸。未指定だとピル形状（＝アイコンが丸）になるので、四角寄りに軽く丸める
capsule_radius = 4
# 要素の間隔。カプセルは thickness(34) * capsule_thickness(0.76) ≈ 26px なのでその半分
widget_spacing = 13

start = [
  "control-center",
  # mango のレイアウト切替 (ezequiel/mango_layouts プラグイン)。
  # 現在のレイアウト記号を表示し、クリックで切替パネルを開く。
  "ezequiel/mango_layouts:btn",
  "clipboard",
  "screenshot",
  "bluetooth",
  "system",
  "caffeine",
  "session",
  # privacy は使用中だけ出るので、他のアイコンがずれないよう最後に置く
  "privacy"
]
center = []
end = []

[backdrop]
blur_intensity = 0.5
enabled = true

# 壁紙。noctalia がある環境では壁紙も noctalia に任せ、mango の autostart から
# awww を起動しないようにしてある (mango/autostart.conf)。画像は
# ~/.config/wallpapers (リポジトリの wallpapers/) に集約し、awww 側も同じ場所を見る。
#
# noctalia の設定は「設定ディレクトリの *.toml → state の settings.toml が上書き」の
# 順に積まれる。directory は設定 UI で変えると state 側に書かれてリポジトリ管理から
# 漏れるため、こちらに置いて state 側からは消してある。last / monitors / favorite は
# 実行時の状態なので state に残したままでよい。
[wallpaper]
directory = "~/.config/wallpapers"

# 新規環境で最初に表示される壁紙。
[wallpaper.default]
path = "~/.config/wallpapers/Ju5PuBC-arch-linux-wallpaper.jpg"

# プラグインの有効化。CLI (noctalia msg plugins enable) で有効にすると
# ~/.local/state/noctalia/settings.toml 側に書かれてリポジトリ管理から漏れるため、
# こちらに明示してバージョン管理下に置く。
[plugins]
enabled = [ "ezequiel/mango_layouts" ]

# プラグインパネルの位置。plugin.toml の既定は bottom_right だが左下に寄せる。
# このキーは設定 UI (Plugins > Position) が state 側に書くものを移してきたもの。
# [shell.panel] の *_position は組み込みパネル 6 種類専用でプラグインには効かない。
[plugin_settings."ezequiel/mango_layouts"]
panel_position = "bottom_left"

[location]
# 天気の地域。IP から自動判定する (noctalia.dev 経由)。
auto_locate = true

[lockscreen]
# ロックは swaylock に寄せる。swayidle が before-sleep 'swaylock -f' を実行するため、
# noctalia がサスペンド前に独自のロック画面を出すと二重になる。
lock_before_suspend = false

[osd.kinds]
# fcitx5 で IME を切り替えるとレイアウト変更として検出され OSD が出るので無効化
keyboard_layout = false

# セッションパネルのアクション。配列なので部分指定できず、デフォルトの 5 つを全て明示する。
# lock 系だけ command で swaylock に差し替え (command を入れると組み込み動作を上書きする)。
[[shell.session.actions]]
action = "lock"
command = "swaylock -f -C ~/.config/swaylock/config"
countdown_seconds = 0.0
enabled = true
glyph = ""
label = ""
shortcut = "1"
variant = "default"

[[shell.session.actions]]
action = "logout"
command = ""
countdown_seconds = 0.0
enabled = true
glyph = ""
label = ""
shortcut = "2"
variant = "default"

[[shell.session.actions]]
action = "lock_and_suspend"
command = "swaylock -f -C ~/.config/swaylock/config && systemctl suspend"
countdown_seconds = 0.0
enabled = true
glyph = ""
label = ""
shortcut = "3"
variant = "default"

[[shell.session.actions]]
action = "reboot"
command = ""
countdown_seconds = 0.0
enabled = true
glyph = ""
label = ""
shortcut = "4"
variant = "default"

[[shell.session.actions]]
action = "shutdown"
command = ""
countdown_seconds = 0.0
enabled = true
glyph = ""
label = ""
shortcut = "5"
variant = "destructive"

# Control Center の System タブを開くボタン。
# noctalia に "system" という組み込みウィジェットは無いので custom_button で作る。
[widget.system]
type = "custom_button"
glyph = "device-desktop"
tooltip = "System"

[widget.system.actions]
left = "panel-toggle control-center system"

# カメラ/マイク/画面共有のインジケータ。使用中だけ表示してスペースを取らない。
[widget.privacy]
type = "privacy"
hide_inactive = true

# screenshot は組み込みのツールチップを持たないので custom_button に置き換える。
# (privacy は bar.widgets.privacy.* の組み込み文言があるのでそのまま)
[widget.screenshot]
type = "custom_button"
glyph = "screenshot"
tooltip = "Screenshot"

[widget.screenshot.actions]
left = "screenshot-region"
right = "screenshot-fullscreen"

# caffeine の ON/OFF 表示は waybar (custom/caffeine) に寄せたので、
# ここはトグル用のボタンに割り切って tooltip を付ける。
[widget.caffeine]
type = "custom_button"
glyph = "coffee"
tooltip = "Caffeine"

[widget.caffeine.actions]
left = "caffeine-toggle"

# built-in ウィジェットは tooltip 設定を受け付けず (unknown setting)、
# 型ごとにツールチップ内容を持つ一部の型しか hover に反応しない。
# アイコンが静的な 3 つは custom_button に置き換えて hover を付ける。
# (caffeine は glyph も受け付けない = ON/OFF でアイコンが変わるため built-in のまま)
[widget.control-center]
type = "custom_button"
glyph = "adjustments"
tooltip = "Control Center"

[widget.control-center.actions]
left = "panel-toggle control-center home"

[widget.clipboard]
type = "custom_button"
glyph = "clipboard"
tooltip = "Clipboard"

[widget.clipboard.actions]
left = "panel-toggle clipboard"

[widget.session]
type = "custom_button"
glyph = "power"
tooltip = "Session"

[widget.session.actions]
left = "panel-toggle session"


